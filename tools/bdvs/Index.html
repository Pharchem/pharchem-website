<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDVS - Batch Document Verification</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1e3a8a;--pri2:#1d4ed8;
--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--info:#1d4ed8;--infob:#dbeafe;--tealb:#ccfbf1;--teal:#0f766e;--grayb:#f1f5f9}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
header{background:var(--pri);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px}
header .sub{opacity:.8;font-size:12px}
header .sp{flex:1}
header .who{font-size:13px;text-align:right}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 10px;cursor:pointer}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav a{padding:11px 14px;color:var(--mut);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:500}
nav a.on{color:var(--pri);border-bottom-color:var(--pri)}
nav a .n{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{padding:18px;max-width:1400px;margin:0 auto}
h2{margin:0 0 12px;font-size:19px}
h3{margin:18px 0 8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.tile .v{font-size:26px;font-weight:700}
.tile .l{color:var(--mut);font-size:12px}
.tile.red .v{color:var(--bad)} .tile.amb .v{color:var(--warn)} .tile.grn .v{color:var(--ok)} .tile.blu .v{color:var(--info)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f8fafc;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.02em;position:sticky;top:0}
tr.over td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)} .c-warn{background:var(--warnb);color:var(--warn)} .c-bad{background:var(--badb);color:var(--bad)}
.c-info{background:var(--infob);color:var(--info)} .c-teal{background:var(--tealb);color:var(--teal)} .c-gray{background:var(--grayb);color:var(--mut)}
.small{font-size:12px;color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--pri2)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}
textarea{min-height:60px}
.err{background:var(--badb);color:var(--bad);padding:9px 12px;border-radius:7px;margin:8px 0;white-space:pre-wrap}
.okmsg{background:var(--okb);color:var(--ok);padding:9px 12px;border-radius:7px;margin:8px 0}
.login{max-width:380px;margin:9vh auto}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 10px}
.modal{background:#fff;border-radius:12px;width:min(820px,100%);padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(1400px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h2{margin:0;flex:1}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--mut)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.doc{border:1px solid var(--line);border-radius:10px;padding:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;margin-bottom:8px}
.facts div b{display:block;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.viewer{border:1px solid var(--line);border-radius:10px;background:#334155;display:flex;flex-direction:column;height:78vh}
.viewer .vt{background:#1e293b;color:#fff;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-radius:10px 10px 0 0}
.viewer .vt button,.viewer .vt select{background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:3px 8px;cursor:pointer}
.viewer .cv{flex:1;overflow:auto;text-align:center;padding:10px}
.viewer canvas{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.ckl{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ck{padding:8px 10px;border-bottom:1px solid var(--line)}
.ck .q{font-weight:500;margin-bottom:4px}
.ck .opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ck .opts label{cursor:pointer}
.ck.no{background:#fff1f2} .ck.na{background:#f8fafc}
.ck input[type=text]{padding:4px 8px;font-size:12px}
.obs td{padding:4px}
.muted{color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;right:18px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:420px}
.timeline{font-size:12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.timeline div{padding:5px 9px;border-bottom:1px solid var(--line)}
#print-area{display:none}
@media print{body>*{display:none!important}#print-area{display:block!important;color:#000;padding:10mm;font-size:13px}#print-area table td,#print-area table th{border:1px solid #000}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>
<div id="print-area"></div>

<script>
/* ======================= core ======================= */
var S = { token: null, boot: null, dash: null, view: null, idle: null, pollTimer: null };
var IST = 330 * 60000;
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOC_STATUS = {
  PENDING_UPLOAD: ['Pending upload', 'c-warn'],
  UNDER_VERIFICATION: ['Under QA verification', 'c-info'],
  REJECTED: ['Rejected - re-upload', 'c-bad'],
  HARDCOPY_PENDING: ['Verified OK - hardcopy pending', 'c-teal'],
  HARDCOPY_DISCREPANCY: ['Hardcopy discrepancy', 'c-bad'],
  HARDCOPY_RECEIVED: ['Verified & hardcopy received', 'c-ok']
};
var BATCH_STATUS = {
  AWAITING_DOCUMENTS: ['Awaiting documents', 'c-warn'],
  UNDER_VERIFICATION: ['Under verification', 'c-info'],
  REJECTED_REUPLOAD: ['Rejected - awaiting re-upload', 'c-bad'],
  AWAITING_HARDCOPY: ['Awaiting hardcopy', 'c-teal'],
  READY_TO_CLOSE: ['Ready to close', 'c-ok'],
  CLOSED: ['Closed - BDV completed', 'c-gray']
};
var OVERDUE = { UPLOAD: 'Upload overdue', VERIFICATION: 'Verification overdue (>24 h)', HARDCOPY: 'Hardcopy overdue' };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ms(iso) { return iso ? new Date(iso).getTime() : NaN; }
function fD(v) { var t = typeof v === 'number' ? v : ms(v); if (isNaN(t)) return '-'; var d = new Date(t + IST); return pad(d.getUTCDate()) + '-' + MON[d.getUTCMonth()] + '-' + d.getUTCFullYear(); }
function fDT(v) { var t = typeof v === 'number' ? v : ms(v); if (isNaN(t)) return '-'; var d = new Date(t + IST); return fD(t) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); }
function fYmd(ymd) { return ymd ? fD(new Date(ymd + 'T12:00:00+05:30').getTime()) : '-'; }
function todayYmd() { var d = new Date(Date.now() + IST); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function hrs(x) { var h = Math.round(Math.abs(x) / 3600000); return h >= 48 ? Math.floor(h / 24) + 'd ' + (h % 24) + 'h' : h + 'h'; }
function left(iso) {
  var d = ms(iso) - Date.now();
  if (isNaN(d)) return '';
  return d >= 0 ? '<span class="small">' + hrs(d) + ' left</span>' : '<span class="small" style="color:var(--bad);font-weight:600">' + hrs(d) + ' overdue</span>';
}
function chip(map, k) { var m = map[k] || [k, 'c-gray']; return '<span class="chip ' + m[1] + '">' + esc(m[0]) + '</span>'; }
function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 4000); }
function role() { return S.boot ? S.boot.user.role : ''; }
function isQA() { return role() === 'QA'; }

function rpc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(e && e.message ? e.message : String(e))); });
    r[fn].apply(r, args);
  });
}
function call(action, payload) {
  payload = Object.assign({ client: navigator.userAgent.slice(0, 150) }, payload || {});
  return rpc('api', S.token, action, payload).then(function (r) {
    if (r.ok) { bumpIdle(); return r.data; }
    if (r.error === 'SESSION_EXPIRED') { endSession('Your session expired. Please log in again.'); }
    if (r.error === 'PASSWORD_CHANGE_REQUIRED') { renderChangePw(true); }
    throw new Error(r.error);
  });
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (label || 'Please wait'); }
  else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; }
}
function showErr(id, e) { var el = $(id); if (el) el.innerHTML = e ? '<div class="err">' + esc(e.message || e) + '</div>' : ''; }

/* ======================= modals ======================= */
function openModal(html, wide) {
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  $('modals').appendChild(bg);
  return bg;
}
function closeModal(el) {
  var bg = el && el.closest ? el.closest('.modal-bg') : null;
  if (bg) bg.remove(); else { var all = document.querySelectorAll('.modal-bg'); if (all.length) all[all.length - 1].remove(); }
}
function mh(title) { return '<div class="mh"><h2>' + title + '</h2><button class="x" onclick="closeModal(this)">&times;</button></div>'; }
function askText(title, labelText, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var bg = openModal(mh(esc(title)) + '<label class="f">' + esc(labelText) + '</label>' +
      (opts.password ? '<input type="password" id="ask_in">' : '<textarea id="ask_in"></textarea>') +
      '<div id="ask_err"></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" id="ask_c">Cancel</button><button class="btn" id="ask_ok">OK</button></div>');
    $('ask_c').onclick = function () { bg.remove(); resolve(null); };
    $('ask_ok').onclick = function () {
      var v = $('ask_in').value.trim();
      if (!v && !opts.optional) { showErr('ask_err', 'Required.'); return; }
      bg.remove(); resolve(v);
    };
    $('ask_in').focus();
  });
}
function confirmBox(title, text) {
  return new Promise(function (resolve) {
    var bg = openModal(mh(esc(title)) + '<p style="white-space:pre-wrap">' + esc(text) + '</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cf_n">Cancel</button><button class="btn" id="cf_y">Continue</button></div>');
    $('cf_n').onclick = function () { bg.remove(); resolve(false); };
    $('cf_y').onclick = function () { bg.remove(); resolve(true); };
  });
}

/* ======================= session ======================= */
function bumpIdle() {
  clearTimeout(S.idle);
  if (!S.token) return;
  var mins = S.boot ? S.boot.config.sessionTimeoutMin : 15;
  S.idle = setTimeout(function () { endSession('Logged out after ' + mins + ' minutes of inactivity.'); }, mins * 60000);
}
['click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { if (S.token) bumpIdle(); }); });

function endSession(msg) {
  if (S.token) { rpc('logout', S.token).catch(function () {}); }
  S.token = null; S.boot = null; S.dash = null; S.view = null; S.batch = null; S.master = null; S.navCounts = null;
  try { sessionStorage.removeItem('bdvs_t'); } catch (e) {}
  clearTimeout(S.idle); clearInterval(S.pollTimer);
  $('modals').innerHTML = '';
  renderLogin(msg);
}

function renderLogin(msg) {
  $('app').innerHTML = '<div class="login card"><h2 style="color:var(--pri)">Batch Document Verification</h2>' +
    '<p class="small">BMR / BPR &middot; COA &amp; raw data &middot; QA verification &middot; hardcopy &middot; batch data verification</p>' +
    (msg ? '<div class="okmsg">' + esc(msg) + '</div>' : '') +
    '<form id="lf"><label class="f">Username</label><input type="text" id="lu" autocomplete="username" autofocus>' +
    '<label class="f" style="margin-top:10px">Password</label><input type="password" id="lp" autocomplete="current-password">' +
    '<div id="lerr"></div><button class="btn" style="width:100%;margin-top:14px" id="lb">Log in</button></form>' +
    '<p class="small" style="margin-top:14px">Use your personal login. Never share your password: every action is recorded against your name in the audit trail.</p></div>';
  $('lf').onsubmit = function (e) {
    e.preventDefault();
    var b = $('lb'); busy(b, true, 'Logging in');
    rpc('login', $('lu').value, $('lp').value, navigator.userAgent.slice(0, 150)).then(function (r) {
      if (!r.ok) throw new Error(r.error);
      S.token = r.data.token;
      try { sessionStorage.setItem('bdvs_t', S.token); } catch (e) {}
      return start();
    }).catch(function (e) { busy(b, false); showErr('lerr', e); });
  };
}

function renderChangePw(forced) {
  var html = mh(forced ? 'Set a new password' : 'Change password') +
    (forced ? '<p>You must set a new password before continuing (first login, reset or expiry).</p>' : '') +
    '<label class="f">Current / temporary password</label><input type="password" id="cp0">' +
    '<label class="f" style="margin-top:8px">New password (min 8 characters, letters and digits)</label><input type="password" id="cp1">' +
    '<label class="f" style="margin-top:8px">Repeat new password</label><input type="password" id="cp2">' +
    '<div id="cperr"></div><div class="row" style="justify-content:flex-end;margin-top:12px">' +
    (forced ? '<button class="btn sec" onclick="endSession()">Log out</button>' : '') + '<button class="btn" id="cpb">Save password</button></div>';
  $('modals').innerHTML = '';
  var bg = openModal(html);
  if (forced) bg.querySelector('.x').remove();
  $('cpb').onclick = function () {
    if ($('cp1').value !== $('cp2').value) { showErr('cperr', 'The new passwords do not match.'); return; }
    var b = $('cpb'); busy(b, true);
    call('changePassword', { oldPassword: $('cp0').value, newPassword: $('cp1').value }).then(function () {
      bg.remove(); toast('Password changed.'); if (forced) start();
    }).catch(function (e) { busy(b, false); showErr('cperr', e); });
  };
}

function start() {
  return call('bootstrap').then(function (b) {
    S.boot = b;
    if (b.user.mustChange) { renderShell(); renderChangePw(true); return; }
    renderShell();
    var first = { QA: 'dashboard', PRD: 'tasks', QC: 'tasks', ADMIN: 'dashboard' }[b.user.role];
    go(S.view && tabsFor().some(function (t) { return t[0] === S.view; }) ? S.view : first);
    clearInterval(S.pollTimer);
    S.pollTimer = setInterval(function () { if (S.token && !document.querySelector('.modal-bg')) go(S.view, true); }, 5 * 60000);
  });
}

/* ======================= shell & navigation ======================= */
function tabsFor() {
  var r = role();
  if (r === 'QA') return [['dashboard', 'Dashboard'], ['register', 'Register dispatch'], ['verify', 'Verification queue'], ['hardcopy', 'Hardcopy receipt'], ['audit', 'Audit trail'], ['reminders', 'Reminder log'], ['settings', 'Settings']];
  if (r === 'ADMIN') return [['dashboard', 'Dashboard'], ['users', 'Users'], ['settings', 'Settings'], ['audit', 'Audit trail'], ['reminders', 'Reminder log']];
  return [['tasks', 'My tasks'], ['dashboard', 'My batches']];
}
function renderShell() {
  var u = S.boot.user;
  $('app').innerHTML = '<header><div><div class="brand">' + esc(S.boot.company || 'BDVS') + '</div><div class="sub">Batch Document Verification System</div></div>' +
    '<div class="sp"></div><div class="who">' + esc(u.name) + '<br><span class="sub">' + esc({ PRD: 'Production', QC: 'Quality Control', QA: 'Quality Assurance', ADMIN: 'Administrator' }[u.role]) + '</span></div>' +
    '<button onclick="renderChangePw(false)">Password</button><button onclick="endSession(\'You have logged out.\')">Log out</button></header>' +
    '<nav id="nav"></nav><main id="view"></main>';
  renderNav();
}
function renderNav(counts) {
  counts = counts || {};
  $('nav').innerHTML = tabsFor().map(function (t) {
    var n = counts[t[0]] ? '<span class="n">' + counts[t[0]] + '</span>' : '';
    return '<a class="' + (S.view === t[0] ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + n + '</a>';
  }).join('');
}
function go(view, silent) {
  S.view = view;
  renderNav(S.navCounts);
  var v = $('view');
  if (!silent) v.innerHTML = '<p class="muted"><span class="spin"></span> Loading...</p>';
  var fn = { dashboard: viewDashboard, tasks: viewTasks, register: viewRegister, verify: viewVerifyQueue, hardcopy: viewHardcopy,
    audit: viewAudit, reminders: viewReminders, settings: viewSettings, users: viewUsers }[view];
  Promise.resolve(fn(v)).catch(function (e) { v.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function loadDash() {
  return call('dashboard').then(function (d) {
    S.dash = d;
    var c = { verify: 0, hardcopy: 0, tasks: 0 };
    d.batches.forEach(function (b) {
      if (b.status === 'CLOSED') return;
      b.docs.forEach(function (x) {
        if (x.status === 'UNDER_VERIFICATION') c.verify++;
        if (x.status === 'HARDCOPY_PENDING' || x.status === 'HARDCOPY_DISCREPANCY') c.hardcopy++;
        if (x.status === 'PENDING_UPLOAD' || x.status === 'REJECTED') c.tasks++;
      });
    });
    S.navCounts = c; renderNav(c);
    return d;
  });
}

/* ======================= dashboard ======================= */
function viewDashboard(v) {
  return loadDash().then(function (d) {
    var c = d.counts;
    var t = function (val, l, cls, f) { return '<div class="tile ' + cls + '" onclick="dashFilter(\'' + f + '\')"><div class="v">' + val + '</div><div class="l">' + l + '</div></div>'; };
    var overdueTotal = c.overdueUpload + c.overdueVerify + c.overdueHardcopy;
    v.innerHTML = '<h2>' + (role() === 'PRD' || role() === 'QC' ? 'My batches' : 'Dashboard') + '</h2>' +
      '<div class="tiles">' +
      t(c.awaitingUpload, 'Documents awaiting upload', 'amb', 'PENDING_UPLOAD') +
      t(c.underVerification, 'Under QA verification', 'blu', 'UNDER_VERIFICATION') +
      t(c.rejected, 'Rejected - awaiting re-upload', c.rejected ? 'red' : '', 'REJECTED') +
      t(c.awaitingHardcopy, 'Hardcopy pending', 'amb', 'HARDCOPY') +
      t(c.readyToClose, 'Batches ready to close', 'grn', 'READY') +
      t(c.closed, 'Batches closed', '', 'CLOSED') +
      t(overdueTotal, 'Overdue (upload ' + c.overdueUpload + ' / verify ' + c.overdueVerify + ' / hardcopy ' + c.overdueHardcopy + ')', overdueTotal ? 'red' : 'grn', 'OVERDUE') +
      '</div>' +
      (d.lastImport ? '<div class="card small" style="padding:10px 14px">Production register last read ' + fDT(d.lastImport.runAt) + ': <b>' + d.lastImport.registered + '</b> registered &middot; ' +
        '<a href="#" onclick="showAwaiting();return false"><b>' + (d.lastImport.details.awaiting || []).length + '</b> manufactured, awaiting dispatch</a>' +

var UP = null;
var UPLOAD_CHECKS = [
  ['allPages', 'All pages scanned, in order, including the index page'],
  ['legible', 'Every page is legible (no cut-off edges, shadows or blur)'],
  ['signatures', 'All entries, signatures and dates are present on the original'],

function findDoc(docId) {

}
function openUpload(docId) {

    '<label class="f">Scanned files (PDF preferred; JPG/PNG pages are combined into one PDF). Max ' + S.boot.config.maxFileMb + ' MB per file.</label>' +
    '<input type="file" id="upf" multiple accept="application/pdf,image/jpeg,image/png">' +
    '<div id="upl" style="margin:8px 0"></div>' +
    '<div class="grid2"><div><label class="f">Total number of pages scanned (count from the physical document)</label><input type="number" min="1" id="upp"></div></div>' +
    '<h3>Upload checklist</h3>' + UPLOAD_CHECKS.map(function (c) { return '<label style="display:block;margin:5px 0"><input type="checkbox" class="upc" data-k="' + c[0] + '"> ' + c[1] + '</label>'; }).join('') +
    '<label class="f" style="margin-top:8px">Remarks (optional)</label><textarea id="upr"></textarea>' +
    '<div id="uperr"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" onclick="closeModal(this)">Cancel</button><button class="btn" id="upb">Upload</button></div>');
  $('upf').onchange = function (e) { addFiles(e.target.files); };
  $('upb').onclick = submitUpload;
}
function addFiles(list) {
  var max = S.boot.config.maxFileMb * 1048576;
  Array.prototype.forEach.call(list, function (f) {
    var item = { file: f, name: f.name, kind: /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name) ? 'pdf' : (/^image\/(jpeg|png)$/.test(f.type) ? 'img' : 'bad'), pages: null, err: '' };
    if (item.kind === 'bad') item.err = 'Not a PDF, JPG or PNG';
    else if (f.size > max) item.err = 'Larger than ' + S.boot.config.maxFileMb + ' MB';
    else if (f.size === 0) item.err = 'Empty file';
    UP.files.push(item);
    if (item.kind === 'img' && !item.err) item.pages = 1;
    if (item.kind === 'pdf' && !item.err) {
      item.pages = '...';
      f.arrayBuffer().then(function (buf) {
        return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      }).then(function (pdf) { item.pages = pdf.numPages; drawFiles(); })
        .catch(function (e) { item.err = e && e.name === 'PasswordException' ? 'Password-protected PDF - not accepted' : 'Cannot read this PDF (' + (e.message || e) + ')'; item.pages = null; drawFiles(); });
    }
  });
  $('upf').value = '';
  drawFiles();
}
function drawFiles() {
  var total = UP.files.reduce(function (s, f) { return s + (typeof f.pages === 'number' && !f.err ? f.pages : 0); }, 0);
  $('upl').innerHTML = UP.files.length ? '<table><tbody>' + UP.files.map(function (f, i) {
    return '<tr><td>' + esc(f.name) + '</td><td>' + (f.kind === 'img' ? 'image (1 page)' : f.pages == null ? '' : f.pages + ' page(s)') + '</td><td>' +
      (f.err ? '<span style="color:var(--bad)">' + esc(f.err) + '</span>' : '<span style="color:var(--ok)">OK</span>') + '</td><td><button class="btn sm sec" onclick="UP.files.splice(' + i + ',1);drawFiles()">Remove</button></td></tr>';
  }).join('') + '</tbody></table><p class="small">Pages detected in files: <b>' + total + '</b>' +
    (UP.files.some(function (f) { return f.kind === 'img'; }) ? ' &middot; images will be combined into one PDF in the order listed' : '') + '</p>' : '';
}
function readB64(blobOrBuf) {
  return new Promise(function (res, rej) {
    var blob = blobOrBuf instanceof Blob ? blobOrBuf : new Blob([blobOrBuf]);
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = function () { rej(r.error); };
    r.readAsDataURL(blob);
  });
}
function imagesToPdf(items) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = null;
  return items.reduce(function (p, it) {
    return p.then(function () {
      return new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () {
          var img = new Image();
          img.onload = function () {
            var land = img.width > img.height;
            var W = land ? 297 : 210, H = land ? 210 : 297;
            if (!doc) doc = new jsPDF({ orientation: land ? 'l' : 'p', unit: 'mm', format: 'a4', compress: true });
            else doc.addPage('a4', land ? 'l' : 'p');
            var s = Math.min(W / img.width, H / img.height);
            var w = img.width * s, h = img.height * s;
            doc.addImage(fr.result, it.file.type === 'image/png' ? 'PNG' : 'JPEG', (W - w) / 2, (H - h) / 2, w, h);
            res();
          };
          img.onerror = function () { rej(new Error('Cannot read image ' + it.name)); };
          img.src = fr.result;
        };
        fr.readAsDataURL(it.file);
      });
    });
  }, Promise.resolve()).then(function () { return doc.output('arraybuffer'); });
}
function submitUpload(confirmDuplicate) {
  var b = $('upb');
  showErr('uperr', null);
  var files = UP.files;
  if (!files.length) return showErr('uperr', 'Attach the scanned file(s).');
  if (files.some(function (f) { return f.err; })) return showErr('uperr', 'Remove the files marked with an error first.');
  if (files.some(function (f) { return f.pages === '...'; })) return showErr('uperr', 'Still reading files, try again in a moment.');
  var checks = {}; var all = true;
  document.querySelectorAll('.upc').forEach(function (c) { checks[c.dataset.k] = c.checked; if (!c.checked) all = false; });
  if (!all) return showErr('uperr', 'Confirm every item of the upload checklist.');
  var declared = Number($('upp').value);
  var total = files.reduce(function (s, f) { return s + f.pages; }, 0);
  if (!(declared > 0)) return showErr('uperr', 'Enter the total number of pages scanned.');
  if (declared !== total) return showErr('uperr', 'Page count mismatch: you entered ' + declared + ' pages but the files contain ' + total + '. Check for missing or extra pages.');
  busy(b, true, 'Preparing files');
  var pdfs = files.filter(function (f) { return f.kind === 'pdf'; });
  var imgs = files.filter(function (f) { return f.kind === 'img'; });
  var out = [];
  Promise.all(pdfs.map(function (f) { return readB64(f.file).then(function (b64) { out.push({ name: f.name, base64: b64, pages: f.pages }); }); }))
    .then(function () {
      if (!imgs.length) return;
      return imagesToPdf(imgs).then(readB64).then(function (b64) { out.push({ name: 'scanned_images.pdf', base64: b64, pages: imgs.length }); });
    })
    .then(function () {
      busy(b, false); busy(b, true, 'Uploading');
      return call('upload', { docId: UP.docId, declaredPages: declared, checklist: checks, remarks: $('upr').value, files: out, confirmDuplicate: confirmDuplicate === true });
    })
    .then(function (r) {
      busy(b, false);
      if (r.needConfirm) {
        return confirmBox('Possible duplicate file', r.message + '\n\nUpload anyway?').then(function (yes) { if (yes) submitUpload(true); });
      }
      closeModal(b);
      toast('Uploaded as version ' + r.versionNo + '. QA has been notified (verification due ' + fDT(r.verifyDueAt) + ').' + (Number(r.lateHours) > 0 ? ' Marked LATE by ' + r.lateHours + ' h.' : ''));
      go(S.view);
    })
    .catch(function (e) { busy(b, false); showErr('uperr', e); });
}

function Viewer(el, versionId, files) {
  this.el = el; this.versionId = versionId; this.files = files; this.idx = 0; this.page = 1; this.scale = 1.3; this.pdf = null;
  el.innerHTML = '<div class="vt"><select class="vf">' + files.map(function (f, i) { return '<option value="' + i + '">' + esc(f.name.replace(/^.*?_v\d+_\d+_/, '')) + ' (' + f.pages + ' p)</option>'; }).join('') + '</select>' +
    '<button class="vp">&lsaquo; Prev</button><span class="vn">-</span><button class="vx">Next &rsaquo;</button><button class="vzo">&minus;</button><button class="vzi">+</button>' +
    '<span class="vi small"></span><span style="flex:1"></span><button class="vd">Download</button></div><div class="cv"><span class="spin"></span></div>';
  var self = this;
  el.querySelector('.vf').onchange = function (e) { self.load(Number(e.target.value)); };
  el.querySelector('.vp').onclick = function () { if (self.page > 1) { self.page--; self.render(); } };
  el.querySelector('.vx').onclick = function () { if (self.pdf && self.page < self.pdf.numPages) { self.page++; self.render(); } };
  el.querySelector('.vzo').onclick = function () { self.scale = Math.max(0.5, self.scale - 0.2); self.render(); };
  el.querySelector('.vzi').onclick = function () { self.scale = Math.min(4, self.scale + 0.2); self.render(); };
  el.querySelector('.vd').onclick = function () { self.download(); };
  this.load(0);
}
Viewer.prototype.load = function (i) {
  var self = this; self.idx = i; self.page = 1;
  var cv = self.el.querySelector('.cv'); cv.innerHTML = '<span class="spin"></span> <span style="color:#fff">Loading scan...</span>';
  call('getFile', { versionId: self.versionId, index: i }).then(function (f) {
    self.el.querySelector('.vi').innerHTML = f.integrityOk ? '<span style="color:#86efac">&#10004; SHA-256 integrity verified</span>' : '<span style="color:#fca5a5">&#9888; INTEGRITY CHECK FAILED</span>';
    var bytes = Uint8Array.from(atob(f.base64), function (c) { return c.charCodeAt(0); });
    return pdfjsLib.getDocument({ data: bytes }).promise;
  }).then(function (pdf) { self.pdf = pdf; self.render(); })
    .catch(function (e) { cv.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
};
Viewer.prototype.render = function () {
  var self = this; if (!self.pdf) return;
  self.el.querySelector('.vn').textContent = 'Page ' + self.page + ' / ' + self.pdf.numPages;
  self.pdf.getPage(self.page).then(function (pg) {
    var vp = pg.getViewport({ scale: self.scale });
    var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    var cv = self.el.querySelector('.cv'); cv.innerHTML = ''; cv.appendChild(c);
    return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  });
};
Viewer.prototype.download = function () {
  var self = this;
  call('getFile', { versionId: self.versionId, index: self.idx, download: true }).then(function (f) {
    var bytes = Uint8Array.from(atob(f.base64), function (c) { return c.charCodeAt(0); });
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();

};

var PRODUCTS = { ALP: 'Aluminium Hydroxide Gel Paste', MGP: 'Magnesium Hydroxide Paste' };
var KINDS = [['BMR', 'Master BMR'], ['STP', 'STP'], ['SPEC', 'Specification'], ['COA', 'COA format']];
var NOISE = /\b(ltd|limited|pvt|private|ok|pending|new|old|correction|extra|batch|size|kgs?|lab|labs|laboratories|healthcare|healthc|health|pharma|pharmaceuticals?|life|science|sciences|india|for|the|and|ip|bp|usp|ih)\b|\d+(\.\d+)?\s*%|\d{1,2}\.\d{1,2}\.\d{2,4}|\(\d+\)|[0-9]+\s*kgs?/gi;
function custKey(n) { return String(n || '').toLowerCase().replace(/&/g, ' ').replace(NOISE, ' ').replace(/[^a-z0-9]+/g, ' ').trim(); }
function codeOf(batchNo, product) {
  var bn = String(batchNo || '').trim().toUpperCase();
  if (/^ALP/.test(bn)) return 'ALP';
  if (/^MGP/.test(bn)) return 'MGP';
  var p = String(product || '').toLowerCase();
  return /alum/.test(p) ? 'ALP' : /magn/.test(p) ? 'MGP' : '';
}
/** Mirrors the server: saved customer profile first, then best name match, then "General". */
function suggestDocs(code, customer) {
  var out = { BMR: '', STP: '', SPEC: '', COA: '' };
  if (!S.master || !code) return out;
  var prof = S.master.profiles.filter(function (p) { return p.key === code + '|' + custKey(customer); })[0];
  var toks = custKey(customer).split(' ').filter(function (t) { return t.length >= 3; });
  KINDS.forEach(function (k) {
    var kind = k[0];
    if (prof) { out[kind] = prof[{ BMR: 'bmrId', STP: 'stpId', SPEC: 'specId', COA: 'coaId' }[kind]] || ''; return; }
    var list = S.master.docs.filter(function (d) { return d.productCode === code && d.kind === kind; });
    var best = null, bs = 0;
    list.forEach(function (d) {
      var hk = ' ' + custKey(d.customerHint) + ' ', sc = 0;
      toks.forEach(function (t) { if (hk.indexOf(' ' + t) >= 0) sc += t.length; });
      if (sc > bs) { best = d; bs = sc; }
    });
    if (!best) best = list.filter(function (d) { return /general/i.test(d.customerHint); })[0];
    out[kind] = best ? best.id : '';
  });
  out._profile = !!prof;
  return out;
}
function masterOptions(code, kind, sel) {
  var list = (S.master ? S.master.docs : []).filter(function (d) { return d.productCode === code && d.kind === kind; })
    .sort(function (a, b) { return a.title.localeCompare(b.title, undefined, { numeric: true }); });
  return '<option value="">- none / not applicable -</option>' + list.map(function (d) {
    return '<option value="' + d.id + '" ' + (d.id === sel ? 'selected' : '') + '>' + esc(d.title) + '</option>';

}

function parseDate(s) {
  s = String(s || '').trim(); var m;

  if ((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/))) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(+m[2]) + '-' + pad(+m[1]);
  if ((m = s.match(/^(\d{1,2})[.\/\- ]([A-Za-z]{3})[A-Za-z]*[.\/\- ](\d{2,4})$/))) {
    var i = MON.map(function (x) { return x.toLowerCase(); }).indexOf(m[2].toLowerCase());
    if (i >= 0) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad(i + 1) + '-' + pad(+m[1]);
  }
  return '';
}

  return call('getSettings').then(function (s) {
    var admin = role() === 'ADMIN';
    var noEmails = ['EMAIL_PRD', 'EMAIL_QC', 'EMAIL_QA'].some(function (k) { var r = s.settings.filter(function (x) { return x.key === k; })[0]; return !r || !r.value; });
    v.innerHTML = '<h2>Settings</h2>' +
      (noEmails ? '<div class="err">Department email addresses are not set yet - reminders cannot be sent. ' + (admin ? 'Fill in EMAIL_PRD, EMAIL_QC, EMAIL_QA and EMAIL_ESCALATION below.' : 'Ask the administrator to set them.') + '</div>' : '') +
      '<div class="card"><h3 style="margin-top:0">System settings</h3>' + (admin ? '' : '<p class="small">Only the administrator can change these.</p>') +
      '<div class="tw"><table><thead><tr><th>Setting</th><th>Value</th><th>Description</th>' + (admin ? '<th></th>' : '') + '</tr></thead><tbody>' +
      s.settings.map(function (r, i) {
        return '<tr><td><code>' + esc(r.key) + '</code></td><td>' + (admin ? '<input type="text" id="st' + i + '" value="' + esc(r.value) + '">' : esc(r.value)) + '</td><td class="small">' + esc(r.description) + '</td>' +
          (admin ? '<td><button class="btn sm" onclick="saveSetting(\'' + r.key + '\',\'st' + i + '\',this)">Save</button></td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      (admin ? '<div class="row" style="margin-top:10px"><button class="btn sm sec" id="tst">Send test email to departments</button><span class="small">Emails left today (Google quota): ' + (s.remainingEmailQuota == null ? '?' : s.remainingEmailQuota) + '</span></div>' : '') + '</div>' +
      '<div class="card"><h3 style="margin-top:0">Daily Production &amp; Dispatch Register</h3><p class="small">Production adds one row per batch every evening (Mfg Date, Batch No., Customer...) and fills <b>Dispatch Date</b> and <b>Invoice / Challan No.</b> when the batch leaves. BDVS reads the sheet every evening, registers dispatched batches automatically, writes the result in the <b>BDVS Status</b> column and emails QA a summary.</p>' +
      '<div class="row"><input type="text" id="psl" placeholder="Link of the Google Sheet" value="' + esc((s.settings.filter(function (x) { return x.key === 'PRODUCTION_SHEET_ID'; })[0] || {}).value ? 'https://docs.google.com/spreadsheets/d/' + (s.settings.filter(function (x) { return x.key === 'PRODUCTION_SHEET_ID'; })[0] || {}).value + '/edit' : '') + '" style="max-width:460px">' +
      '<button class="btn sm sec" id="psb">Link sheet</button><button class="btn sm sec" id="psc">Create template sheet</button><button class="btn sm" id="psr">Read now</button></div><div id="psm" class="small" style="margin-top:6px"></div><div id="psl2" style="margin-top:8px"></div></div>' +
      '<div class="card"><h3 style="margin-top:0">GMP document master</h3><p class="small">BDVS reads the GMP folder (skipping Draft / Obsolete folders) and indexes every BMR, STP, specification (SPE) and COA format (PCF-FMR) by product and customer, so batches are auto-filled at registration. Re-scan after you add or revise documents in the folder.</p>' +
      '<div class="row"><input type="text" id="gmpf" placeholder="GMP folder link or ID" value="' + esc((s.settings.filter(function (x) { return x.key === 'GMP_FOLDER_ID'; })[0] || {}).value || '') + '" style="max-width:420px"><button class="btn sm" id="gmpb">Scan GMP folder</button><span id="gmpr" class="small"></span></div>' +
      '<div id="gmpl" style="margin-top:8px"></div></div>' +
      '<div class="card"><h3 style="margin-top:0">Holiday calendar <span class="small">(Sundays are always excluded; add declared holidays)</span></h3>' +
      '<div class="row"><input type="date" id="hd" style="max-width:180px"><input type="text" id="hn" placeholder="Holiday name" style="max-width:260px"><button class="btn sm" id="hb">Add holiday</button></div>' +
      '<table style="margin-top:8px"><tbody>' + (s.holidays.length ? s.holidays.map(function (h) {
        return '<tr><td>' + fYmd(h.date) + '</td><td>' + esc(h.name) + '</td><td class="small">added by ' + esc(h.addedBy) + '</td><td><button class="btn sm sec" onclick="removeHoliday(\'' + h.date + '\')">Remove</button></td></tr>';
      }).join('') : '<tr><td class="muted">No holidays declared.</td></tr>') + '</tbody></table></div>' +
      Object.keys(S.boot.docTypes).map(function (t) {
        var items = s.checklists.filter(function (c) { return c.docType === t; }).sort(function (a, b) { return a.order - b.order; });
        return '<div class="card"><h3 style="margin-top:0">QA verification checklist - ' + esc(S.boot.docTypes[t].label) + '</h3><table><tbody>' + items.map(function (c) {
          return '<tr style="' + (c.active === 'Y' ? '' : 'opacity:.5') + '"><td style="width:30px">' + c.order + '</td><td>' + esc(c.item) + (c.active === 'Y' ? '' : ' <span class="chip c-gray">inactive</span>') + '</td><td style="white-space:nowrap">' +
            '<button class="btn sm sec" onclick="editCk(\'' + c.id + '\',\'' + t + '\')">Edit</button> <button class="btn sm sec" onclick="toggleCk(\'' + c.id + '\',\'' + t + '\',' + (c.active !== 'Y') + ')">' + (c.active === 'Y' ? 'Deactivate' : 'Activate') + '</button></td></tr>';
        }).join('') + '</tbody></table><div class="row" style="margin-top:8px"><input type="text" id="nk_' + t + '" placeholder="New checklist item"><button class="btn sm" onclick="addCk(\'' + t + '\')">Add item</button></div></div>';
      }).join('');
    S.ckData = s.checklists;
    if (admin) $('tst').onclick = function () { var b = this; busy(b, true); call('sendTestEmail').then(function (r) { busy(b, false); toast('Test email ' + r.status + ' to ' + r.sentTo.join(', ')); }).catch(function (e) { busy(b, false); toast(e.message); }); };
    $('gmpb').onclick = function () {
      var b = this; busy(b, true, 'Scanning folder');
      call('importDocMaster', { folderId: $('gmpf').value }).then(function (r) {
        busy(b, false); $('gmpr').textContent = r.total + ' documents indexed (' + r.added + ' new, ' + r.updated + ' refreshed, ' + r.retired + ' removed).'; drawMasterList();
      }).catch(function (e) { busy(b, false); $('gmpr').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; });
    };
    drawMasterList();
    $('psb').onclick = function () { var b = this; busy(b, true); call('linkProductionSheet', { sheet: $('psl').value }).then(function (r) { busy(b, false); $('psm').innerHTML = '<span style="color:var(--ok)">Linked: ' + esc(r.name) + '</span>'; }).catch(function (e) { busy(b, false); $('psm').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; }); };
    $('psc').onclick = function () { var b = this; busy(b, true); call('createProductionSheet', {}).then(function (r) { busy(b, false); $('psl').value = r.url; $('psm').innerHTML = 'Created and linked. <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open the register</a> - it is shared with the Production mailbox (edit) and QC / QA (view).'; }).catch(function (e) { busy(b, false); $('psm').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; }); };
    $('psr').onclick = function () { var b = this; busy(b, true, 'Reading'); call('importProduction', {}).then(function (r) { busy(b, false); $('psm').innerHTML = importSummary(r); drawImportLog(); loadDash(); }).catch(function (e) { busy(b, false); $('psm').innerHTML = '<span style="color:var(--bad)">' + esc(e.message) + '</span>'; }); };
    drawImportLog();
    $('hb').onclick = function () { call('addHoliday', { date: $('hd').value, name: $('hn').value }).then(function () { toast('Holiday added.'); go('settings'); }).catch(function (e) { toast(e.message); }); };
  });
}
function importSummary(r) {
  return '<b>' + r.registered.length + ' registered</b>, ' + r.awaiting.length + ' awaiting dispatch, ' + r.already + ' already registered' +
    (r.errors.length ? ', <b style="color:var(--bad)">' + r.errors.length + ' with problems</b>: ' + r.errors.map(function (e) { return 'row ' + e.row + ' ' + esc(e.batchNo) + ' - ' + esc(e.error); }).join('; ') : '') +
    (r.registered.some(function (x) { return x.matchSource !== 'remembered'; }) ? '<br><span style="color:var(--warn)">New customers were auto-matched to master documents - check them in the batch (Change master documents).</span>' : '');
}
function drawImportLog() {
  call('importLog').then(function (log) {
    $('psl2').innerHTML = log.length ? '<details><summary>Last reads (' + log.length + ')</summary><table><thead><tr><th>Read at</th><th>By</th><th>Registered</th><th>Awaiting dispatch</th><th>Problems</th></tr></thead><tbody>' + log.map(function (l) {
      return '<tr class="small"><td>' + fDT(l.runAt) + '</td><td>' + esc(l.by) + '</td><td>' + l.registered + '</td><td>' + l.awaitingDispatch + '</td><td>' + (Number(l.errors) ? '<b style="color:var(--bad)">' + l.errors + '</b> ' + (l.details.errors || []).map(function (e) { return 'row ' + e.row + ': ' + esc(e.error); }).join('; ') : '0') + (l.details.missingDay ? ' <b style="color:var(--bad)">register not filled</b>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></details>' : '<p class="muted small">Not read yet.</p>';
  }).catch(function () {});
}
function drawMasterList() {
  loadMaster().then(function (m) {
    var by = {};
    m.docs.forEach(function (d) { var k = d.productCode + ' ' + d.kind; (by[k] = by[k] || []).push(d); });
    $('gmpl').innerHTML = !m.docs.length ? '<p class="muted">Not indexed yet.</p>' : '<details><summary>' + m.docs.length + ' master documents indexed &middot; ' + m.profiles.length + ' customer profiles remembered</summary>' +
      Object.keys(by).sort().map(function (k) {
        return '<h3>' + esc(k.replace('SPEC', 'Specification').replace('COA', 'COA format')) + ' (' + by[k].length + ')</h3><div class="small">' + by[k].sort(function (a, b) { return a.title.localeCompare(b.title, undefined, { numeric: true }); })
          .map(function (d) { return '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.title) + '</a>' + (d.batchSize ? ' (' + esc(d.batchSize) + ')' : ''); }).join(' &middot; ') + '</div>';
      }).join('') +
      (m.profiles.length ? '<h3>Customer profiles</h3><table><thead><tr><th>Product</th><th>Customer</th><th>BMR</th><th>STP</th><th>Spec</th><th>COA format</th><th>Size</th><th>Last used</th></tr></thead><tbody>' + m.profiles.map(function (p) {
        var t = function (id) { var d = m.docs.filter(function (x) { return x.id === id; })[0]; return d ? esc(d.title) : '<span class="muted">-</span>'; };
        return '<tr class="small"><td>' + p.productCode + '</td><td>' + esc(p.customer) + '</td><td>' + t(p.bmrId) + '</td><td>' + t(p.stpId) + '</td><td>' + t(p.specId) + '</td><td>' + t(p.coaId) + '</td><td>' + esc(p.batchSize) + '</td><td>' + fD(p.updatedAt) + '</td></tr>';
      }).join('') + '</tbody></table>' : '') + '</details>';
  }).catch(function (e) { $('gmpl').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function saveSetting(key, inputId, btn) {
  var val = $(inputId).value;
  askText('Change ' + key, 'Reason for change (recorded in the audit trail)').then(function (reason) {
    if (!reason) return;
    busy(btn, true);
    call('saveSetting', { key: key, value: val, reason: reason }).then(function () { busy(btn, false); toast(key + ' saved.'); }).catch(function (e) { busy(btn, false); toast(e.message); });
  });
}
function removeHoliday(date) {
  askText('Remove holiday ' + fYmd(date), 'Reason (recorded in the audit trail)').then(function (r) {
    if (r) call('removeHoliday', { date: date, reason: r }).then(function () { go('settings'); }).catch(function (e) { toast(e.message); });
  });
}
function editCk(id, t) {
  var c = S.ckData.filter(function (x) { return x.id === id; })[0];
  var bg = openModal(mh('Edit checklist item') + '<textarea id="ek" style="min-height:90px">' + esc(c.item) + '</textarea><label class="f" style="margin-top:8px">Reason for change</label><input type="text" id="ekr">' +
    '<div id="ekerr"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="ekb">Save</button></div>');
  $('ekb').onclick = function () {
    if (!$('ekr').value.trim()) return showErr('ekerr', 'Give a reason.');
    call('saveChecklistItem', { id: id, docType: t, item: $('ek').value, active: c.active === 'Y', reason: $('ekr').value }).then(function () { bg.remove(); refreshBoot().then(function () { go('settings'); }); }).catch(function (e) { showErr('ekerr', e); });
  };
}
function toggleCk(id, t, active) {
  var c = S.ckData.filter(function (x) { return x.id === id; })[0];
  askText((active ? 'Activate' : 'Deactivate') + ' checklist item', 'Reason (recorded in the audit trail)').then(function (r) {
    if (r) call('saveChecklistItem', { id: id, docType: t, item: c.item, active: active, reason: r }).then(function () { refreshBoot().then(function () { go('settings'); }); }).catch(function (e) { toast(e.message); });
  });
}
function addCk(t) {
  var txt = $('nk_' + t).value;
  call('saveChecklistItem', { docType: t, item: txt }).then(function () { refreshBoot().then(function () { go('settings'); }); }).catch(function (e) { toast(e.message); });
}
function refreshBoot() { return call('bootstrap').then(function (b) { S.boot = b; }); }

/* ======================= users ======================= */
function viewUsers(v) {
  return call('listUsers').then(function (users) {
    S.users = users;
    v.innerHTML = '<h2>Users</h2><div class="card"><h3 style="margin-top:0">Add a user</h3><p class="small">One login per person. Department mailboxes receive notifications automatically; a personal email here also gets that department\'s reminders. Users are never deleted - disable them instead.</p>' +
      '<div class="grid2"><div><label class="f">Full name</label><input type="text" id="u1"></div><div><label class="f">Username</label><input type="text" id="u2" placeholder="e.g. rpatil"></div>' +
      '<div><label class="f">Email (optional)</label><input type="email" id="u3"></div><div><label class="f">Role</label><select id="u4"><option value="PRD">Production (uploads BMR / BPR)</option><option value="QC">QC (uploads COA + raw data)</option><option value="QA">QA (registers, verifies, closes)</option><option value="ADMIN">Administrator (users & settings only)</option></select></div></div>' +
      '<div id="uerr"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="ub">Create user</button></div></div>' +
      '<div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Email</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>' +
      users.map(function (u) {
        return '<tr style="' + (u.active ? '' : 'opacity:.55') + '"><td>' + esc(u.name) + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.role) + '</td><td>' + esc(u.email) + '</td><td>' +
          (u.active ? '<span class="chip c-ok">Active</span>' : '<span class="chip c-gray">Disabled</span>') + (u.locked ? ' <span class="chip c-bad">Locked</span>' : '') + (u.mustChange ? ' <span class="chip c-warn">Must change pw</span>' : '') +
          '</td><td class="small">' + fD(u.createdAt) + '<br>' + esc(u.createdBy) + '</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="editUser(\'' + u.id + '\')">Edit</button> <button class="btn sm sec" onclick="resetPw(\'' + u.id + '\')">Reset password</button>' +
          (u.locked ? ' <button class="btn sm" onclick="userUpd(\'' + u.id + '\',{unlock:true})">Unlock</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    $('ub').onclick = function () {
      var b = $('ub'); busy(b, true);
      call('createUser', { name: $('u1').value, username: $('u2').value, email: $('u3').value, role: $('u4').value }).then(function (r) {
        busy(b, false); showTemp(r);
      }).catch(function (e) { busy(b, false); showErr('uerr', e); });
    };
  });
}
function showTemp(r) {
  var bg = openModal(mh('Temporary password') + '<p>Give these details to the user personally. They must set their own password at first login.</p><div class="card"><div>Username: <b>' + esc(r.username) + '</b></div><div>Temporary password: <b style="font-family:monospace;font-size:16px">' + esc(r.tempPassword) + '</b></div></div>' +
    '<p class="small">This password is shown only once.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="tpok">Done</button></div>');
  $('tpok').onclick = function () { bg.remove(); go('users'); };
}
function editUser(id) {
  var u = S.users.filter(function (x) { return x.id === id; })[0];
  var bg = openModal(mh('Edit ' + esc(u.username)) + '<div class="grid2"><div><label class="f">Full name</label><input type="text" id="e1" value="' + esc(u.name) + '"></div><div><label class="f">Email</label><input type="email" id="e2" value="' + esc(u.email) + '"></div>' +
    '<div><label class="f">Role</label><select id="e3">' + ['PRD', 'QC', 'QA', 'ADMIN'].map(function (r) { return '<option ' + (u.role === r ? 'selected' : '') + '>' + r + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f">Status</label><select id="e4"><option value="1" ' + (u.active ? 'selected' : '') + '>Active</option><option value="0" ' + (u.active ? '' : 'selected') + '>Disabled</option></select></div></div>' +
    '<label class="f" style="margin-top:8px">Reason for change</label><input type="text" id="e5"><div id="eerr"></div><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="eb">Save</button></div>');
  $('eb').onclick = function () {
    if (!$('e5').value.trim()) return showErr('eerr', 'Give a reason.');
    call('updateUser', { id: id, name: $('e1').value, email: $('e2').value, role: $('e3').value, active: $('e4').value === '1', reason: $('e5').value })
      .then(function () { bg.remove(); go('users'); }).catch(function (e) { showErr('eerr', e); });
  };
}
function userUpd(id, p) { call('updateUser', Object.assign({ id: id }, p)).then(function () { go('users'); }).catch(function (e) { toast(e.message); }); }
function resetPw(id) {
  confirmBox('Reset password', 'Generate a new temporary password for this user? Their current password stops working immediately.').then(function (y) {
    if (y) call('resetPassword', { id: id }).then(showTemp).catch(function (e) { toast(e.message); });
  });
}

/* ======================= boot ======================= */
(function init() {
  if (window.pdfjsLib) { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
  var t = null;
  try { t = sessionStorage.getItem('bdvs_t'); } catch (e) {}
  if (t) { S.token = t; start().catch(function () { endSession(); }); }
  else renderLogin();
})();
</script>
</body>
</html>
